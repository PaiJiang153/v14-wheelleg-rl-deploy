seed: 42
num_steps_per_env: 48
max_iterations: 600
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 50
experiment_name: wheelleg_v14_rise
run_name: riseH_bc_ft
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: true
load_run: warmstart_bc
load_checkpoint: model_.*.pt
clip_actions: 100.0
upload_model: true
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 256
  - 256
  - 256
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
critic:
  hidden_dims: !!python/tuple
  - 256
  - 256
  - 256
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.004
  desired_kl: 0.005
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: PPO
